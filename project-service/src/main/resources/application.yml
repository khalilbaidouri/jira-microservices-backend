server:
  port: 8083

spring:
  application:
    name: project-service

  datasource:
    url: jdbc:postgresql://localhost:5433/project_db
    username: project_service
    password: project_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Valide la signature du token auprès du Realm Keycloak existant
          issuer-uri: http://localhost:8080/realms/jira

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG