server:
  port: 8085

spring:
  application:
    name: gateway-service

  spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/jira/protocol/openid-connect/auth
            token-uri: http://keycloak:8080/realms/jira/protocol/openid-connect/token
            jwk-set-uri: http://keycloak:8080/realms/jira/protocol/openid-connect/certs
            user-info-uri: http://keycloak:8080/realms/jira/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway-client
            client-secret: Yi9O6qnpmFzVvTFEWbOkqxPeSeMXKLAl
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope:
              - openid
              - profile
              - email

  cloud:
    gateway:
      default-filters:
        - TokenRelay
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: user-service-route
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**
        - id: project-service-route
          uri: http://project-service:8083
          predicates:
            - Path=/api/projects/**
        - id: issue-service-route
          uri: http://issue-service:8084
          predicates:
            - Path=/api/issues/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
