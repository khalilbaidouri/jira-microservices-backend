server:
  port: 8085

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/jira
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway-client # Ou le nom exact de ton client créé
            client-secret: g7OZJBxAULwitr2MORox1TEvunaNsm2a # Copié depuis l'onglet Credentials de Keycloak
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile, email

  cloud:
    gateway:
      # Filtre global : transforme le cookie de session en header "Authorization: Bearer <JWT>"
      default-filters:
        - TokenRelay

      # Configuration CORS adaptée aux cookies de session BFF
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200" # Avec allowCredentials: true, on ne peut pas mettre "*"
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Définition des règles de routage
      routes:
        # Route 1 : USER-SERVICE
        - id: user-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        # Route 2 : PROJECT-SERVICE
        - id: project-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/projects/**

        # Route 3 : ISSUE-SERVICE
        - id: issue-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/issues/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG